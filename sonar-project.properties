# Configuration SonarQube pour simplon-finance4all-front-1

# Informations du projet
sonar.projectKey=simplon-finance4all-front-1
sonar.projectName=simplon-finance4all-front-1
sonar.projectVersion=1.0

# Sources et tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.jsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.min.js
sonar.test.exclusions=**/node_modules/**,**/build/**,**/dist/**

# Couverture de code
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/index.js,**/serviceWorker.js

# Langue
sonar.language=js

# Encodage des fichiers source
sonar.sourceEncoding=UTF-8

# Qualité du code
sonar.qualitygate.wait=true

# ESLint
sonar.eslint.reportPaths=eslint-report.json 
