# Configuration SonarQube pour Finance4All Front-1
sonar.projectKey=simplon-finance4all-front-1
sonar.organization=simplon-finance4all
sonar.projectName=Finance4All Front-1
sonar.projectVersion=1.0.0

# Sources et exclusions
sonar.sources=src
sonar.exclusions=**/*.test.js,**/*.test.ts,**/node_modules/**,**/dist/**,**/*.spec.js,**/*.spec.ts,**/*.config.js,**/*.config.ts,**/public/**

# Tests et coverage (si configuré)
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Configuration TypeScript/JavaScript
sonar.typescript.node.maxspace=4096

# Host URL (votre serveur SonarQube)
sonar.host.url=http://161.97.89.159:9000

# Encodage
sonar.sourceEncoding=UTF-8

# Duplication
sonar.cpd.exclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts