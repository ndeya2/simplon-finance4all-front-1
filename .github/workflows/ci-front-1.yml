name: CI/CD Pipeline Front-1 Professional

on:
  push:
    branches: [ feature/ci-cd, main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  DOCKER_IMAGE_NAME: simplon-finance4all-front-1
  SONAR_HOST_URL: http://161.97.89.159:9000

jobs:
  # ==========================================
  # JOB 1: TESTS ET VALIDATION
  # ==========================================
  test-front-1:
    name: "Tests & Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for test framework
        run: |
          echo "📋 Available scripts:"
          npm run
          echo "Project uses Vite - creating test placeholder"

      - name: Create test coverage placeholder
        run: |
          mkdir -p coverage
          echo "# Test Coverage Report - ${{ github.sha }}" > coverage/README.md
          echo "No tests configured yet for this Vite project" >> coverage/README.md
          echo "Consider adding Vitest: npm install --save-dev vitest" >> coverage/README.md
          echo "Build date: $(date)" >> coverage/README.md

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-front-1-${{ github.run_number }}
          path: coverage/
          retention-days: 7

  # ==========================================
  # JOB 2: BUILD APPLICATION
  #
