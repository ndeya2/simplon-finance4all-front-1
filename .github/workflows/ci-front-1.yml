name: CI/CD Pipeline Front-1 Professional

on:
  push:
    branches: [ feature/ci-cd, main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  DOCKER_IMAGE_NAME: simplon-finance4all-front-1

jobs:
  # ==========================================
  # JOB 1: TESTS ET VALIDATION
  # ==========================================
  test-front-1:
    name: "Tests & Linting"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Check for test framework
      run: |
        echo "📋 Available scripts:"
        npm run
        echo "Project uses Vite - creating test placeholder"
        
    - name: Create test coverage placeholder
      run: |
        mkdir -p coverage
        echo "# Test Coverage Report - ${{ github.sha }}" > coverage/README.md
        echo "No tests configured yet for this Vite project" >> coverage/README.md
        echo "Consider adding Vitest: npm install --save-dev vitest" >> coverage/README.md
        echo "Build date: $(date)" >> coverage/README.md
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results-front-1-${{ github.run_number }}
        path: coverage/
        retention-days: 7

  # ==========================================
  # JOB 2: BUILD APPLICATION
  # ==========================================
  build-front-1:
    name: "Build Application"
    runs-on: ubuntu-latest
    needs: test-front-1
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Build application with Vite
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-front-1-${{ github.run_number }}
        path: dist/
        retention-days: 30

  # ==========================================
  # JOB 3: BUILD DOCKER IMAGE
  # ==========================================
  docker-build-front-1:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: build-front-1
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-front-1-${{ github.run_number }}
        path: dist/
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} .
        docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_NAME }}:latest
        
    - name: Save Docker image
      run: |
        docker save ${{ env.DOCKER_IMAGE_NAME }}:latest | gzip > docker-image-front-1.tar.gz
        
    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-front-1-${{ github.run_number }}
        path: docker-image-front-1.tar.gz
        retention-days: 7

  # ==========================================
  # JOB 4: SECURITY SCAN (Parallèle)
  # ==========================================
  security-scan-front-1:
    name: "Security Analysis"
    runs-on: ubuntu-latest
    needs: docker-build-front-1
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image-front-1-${{ github.run_number }}
        
    - name: Load Docker image
      run: |
        gunzip -c docker-image-front-1.tar.gz | docker load
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results-front-1.sarif'
    
    - name: Upload Trivy scan results
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-front-1-${{ github.run_number }}
        path: trivy-results-front-1.sarif
        retention-days: 30

  # ==========================================
  # JOB 5: QUALITY ANALYSIS (Corrigé)
  # ==========================================
  quality-analysis-front-1:
    name: "Code Quality"
    runs-on: ubuntu-latest
    needs: test-front-1
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
    
    - name: Create sonar-project.properties if not exists
      run: |
        if [ ! -f sonar-project.properties ]; then
          echo "Creating sonar-project.properties..."
          cat > sonar-project.properties << EOF
        # Configuration SonarQube
        sonar.projectKey=simplon-finance4all-front-1
        sonar.organization=simplon-finance4all
        sonar.projectName=Finance4All Front-1
        sonar.projectVersion=1.0.0
        
        # Sources
        sonar.sources=src
        sonar.exclusions=**/*.test.js,**/*.test.ts,**/node_modules/**,**/dist/**,**/*.spec.js,**/*.spec.ts
        
        # Language
        sonar.javascript.lcov.reportPaths=coverage/lcov.info
        sonar.typescript.lcov.reportPaths=coverage/lcov.info
        
        # Host URL
        sonar.host.url=http://161.97.89.159:9000
        EOF
        fi
        
    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: "http://161.97.89.159:9000"
    
    - name: SonarQube Quality Gate check
      uses: sonarsource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true

  # ==========================================
  # JOB 6: DEPLOY TO REGISTRIES (Corrigé)
  # ==========================================
  deploy-registries-front-1:
    name: "Deploy to Registries"
    runs-on: ubuntu-latest
    needs: [docker-build-front-1, security-scan-front-1]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image-front-1-${{ github.run_number }}
        
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-front-1-${{ github.run_number }}
        path: dist/
        
    - name: Load Docker image
      run: |
        gunzip -c docker-image-front-1.tar.gz | docker load
    
    # DOCKER HUB DEPLOYMENT
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      continue-on-error: true
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Push to Docker Hub
      continue-on-error: true
      run: |
        # Generate version tag
        VERSION_TAG=$(date +%Y%m%d)-${GITHUB_SHA::8}
        
        # Tag images
        docker tag ${{ env.DOCKER_IMAGE_NAME }}:latest ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
        docker tag ${{ env.DOCKER_IMAGE_NAME }}:latest ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${VERSION_TAG}
        docker tag ${{ env.DOCKER_IMAGE_NAME }}:latest ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
        
        # Push images
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${VERSION_TAG}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
        
        echo "🐳 Docker images pushed:"
        echo "- latest"
        echo "- ${VERSION_TAG}"
        echo "- ${{ github.sha }}"
    
    # NEXUS DEPLOYMENT (URL corrigée)
    - name: Upload artifacts to Nexus Repository
      continue-on-error: true
      run: |
        # Create artifact package
        tar -czf ${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}.tar.gz -C dist .
        
        # Generate version info
        VERSION_TAG=$(date +%Y%m%d)-${GITHUB_SHA::8}
        
        # Debug info
        echo "📦 Nexus deployment info:"
        echo "Archive: ${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}.tar.gz"
        echo "Size: $(ls -lh ${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}.tar.gz)"
        echo "Version: ${VERSION_TAG}"
        
        # Upload to Nexus (URL corrigée)
        NEXUS_BASE_URL="http://161.97.89.159:8081"
        UPLOAD_URL="${NEXUS_BASE_URL}/repository/simplon-finance4all-front-1/com/simplon/finance4all-front-1/${VERSION_TAG}/${{ env.DOCKER_IMAGE_NAME }}-${VERSION_TAG}.tar.gz"
        
        echo "Upload URL: ${UPLOAD_URL}"
        
        # Rename file with version
        cp ${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}.tar.gz ${{ env.DOCKER_IMAGE_NAME }}-${VERSION_TAG}.tar.gz
        
        # Upload to Nexus
        curl -v -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
          --upload-file ${{ env.DOCKER_IMAGE_NAME }}-${VERSION_TAG}.tar.gz \
          "${UPLOAD_URL}" || echo "❌ Nexus upload failed, but continuing..."
        
        echo "📦 Artifact uploaded to Nexus with version: ${VERSION_TAG}"

  # ==========================================
  # JOB 7: NOTIFICATION ET RÉSUMÉ
  # ==========================================
  notify-front-1:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [test-front-1, build-front-1, docker-build-front-1, security-scan-front-1, quality-analysis-front-1, deploy-registries-front-1]
    if: always()
    
    steps:
    - name: Pipeline Results Summary
      run: |
        echo "## 🚀 Pipeline CI/CD Results - simplon-finance4all-front-1" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Job Status:" >> $GITHUB_STEP_SUMMARY
        echo "- 🧪 **Tests**: ${{ needs.test-front-1.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 🏗️ **Build**: ${{ needs.build-front-1.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 🐳 **Docker**: ${{ needs.docker-build-front-1.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 🔒 **Security**: ${{ needs.security-scan-front-1.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 📊 **Quality**: ${{ needs.quality-analysis-front-1.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 🚀 **Deploy**: ${{ needs.deploy-registries-front-1.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Artifacts Generated:" >> $GITHUB_STEP_SUMMARY
        echo "- Test coverage reports" >> $GITHUB_STEP_SUMMARY
        echo "- Build artifacts (dist/)" >> $GITHUB_STEP_SUMMARY
        echo "- Docker image: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security scan results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build ID**: ${{ github.run_number }} | **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch**: ${{ github.ref_name }} | **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Status summary
        if [[ "${{ needs.test-front-1.result }}" == "success" && "${{ needs.build-front-1.result }}" == "success" && "${{ needs.docker-build-front-1.result }}" == "success" ]]; then
          echo "### ✅ Pipeline Status: **SUCCESS**" >> $GITHUB_STEP_SUMMARY
          echo "All critical jobs completed successfully!" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Pipeline Status: **FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "One or more critical jobs failed. Check the logs above." >> $GITHUB_STEP_SUMMARY
        fi