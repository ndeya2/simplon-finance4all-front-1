name: CI/CD Pipeline Front-1 Professional

on:
  push:
    branches: [feature/ci-cd, main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  DOCKER_IMAGE_NAME: simplon-finance4all-front-1
  SONAR_HOST_URL: http://161.97.89.159:9000

jobs:
  # ==========================================
  # JOB 1: TESTS ET VALIDATION
  # ==========================================
  test-front-1:
    name: "Tests & Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test coverage placeholder
        run: |
          mkdir -p coverage
          echo "# Test Coverage Report - ${{ github.sha }}" > coverage/README.md
          echo "No tests configured yet for this Vite project" >> coverage/README.md
          echo "Build date: $(date)" >> coverage/README.md

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-front-1-${{ github.run_number }}
          path: coverage/
          retention-days: 7

  # ==========================================
  # JOB 2: BUILD APPLICATION
  # ==========================================
  build-front-1:
    name: "Build Application"
    runs-on: ubuntu-latest
    needs: test-front-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application with Vite
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-front-1-${{ github.run_number }}
          path: dist/
          retention-days: 30

  # ==========================================
  # JOB 3: BUILD DOCKER IMAGE
  # ==========================================
  docker-build-front-1:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: build-front-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-front-1-${{ github.run_number }}
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and tag Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Save Docker image
        run: docker save ${{ env.DOCKER_IMAGE_NAME }}:latest | gzip > docker-image-front-1.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-front-1-${{ github.run_number }}
          path: docker-image-front-1.tar.gz
          retention-days: 7

  # ==========================================
  # JOB 4: SECURITY SCAN
  # ==========================================
  security-scan-front-1:
    name: "Security Analysis"
    runs-on: ubuntu-latest
    needs: docker-build-front-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-front-1-${{ github.run_number }}

      - name: Load Docker image
        run: gunzip -c docker-image-front-1.tar.gz | docker load

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results-front-1.sarif

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-front-1-${{ github.run_number }}
          path: trivy-results-front-1.sarif
          retention-days: 30

  # ==========================================
  # JOB 5: QUALITY ANALYSIS (SonarQube)
  # ==========================================
  quality-analysis-front-1:
    name: "Code Quality"
    runs-on: ubuntu-latest
    needs: test-front-1
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=simplon-finance4all-front-1
            -Dsonar.sources=src
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
            -Dsonar.projectName="Finance4All Front-1"
            -Dsonar.projectVersion=1.0.0

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        continue-on-error: true

      - name: Generate Analysis Report
        if: always()
        run: |
          echo "## 📊 SonarQube Analysis Report" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** simplon-finance4all-front-1" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ env.SONAR_HOST_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Results](${{ env.SONAR_HOST_URL }}/dashboard?id=simplon-finance4all-front-1)" >> $GITHUB_STEP_SUMMARY
